<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi Digital Sekolah</title>
  <!-- Library Pindai QR Code Standar -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- Face-API.js untuk Fitur Deteksi dan Login Pengenalan Wajah -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
  <!-- Google Fonts untuk Tampilan Premium -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f5132;        /* Hijau Zamrud Khas Tahfidz */
      --primary-light: #d1e7dd;  /* Hijau Muda Lembut */
      --accent: #e5a93b;         /* Emas Hangat Premium */
      --bg: #f4f7f5;             /* Abu-abu Hijau Sangat Terang */
      --text-main: #1e293b;
      --text-muted: #64748b;
      --white: #ffffff;
      --success: #198754;
      --danger: #dc3545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    /* Header Aplikasi */
    .header-app {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-container {
      width: 90px;
      height: 90px;
      background: var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
      box-shadow: 0 8px 16px rgba(15, 81, 50, 0.08);
      border: 3px solid var(--accent);
    }
    .logo-container img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }
    .header-app h1 {
      font-size: 22px;
      color: var(--primary);
      font-weight: 700;
    }
    .header-app p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Main Container (Layout Multi-Tab Terpadu) */
    .main-wrapper {
      width: 100%;
      max-width: 480px;
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(15, 81, 50, 0.06);
      overflow: hidden;
    }

    /* Tab Switcher */
    .tab-navigation {
      display: flex;
      background: #f8faf9;
      border-bottom: 1px solid #edf2f0;
      overflow-x: auto;
    }
    .tab-btn {
      flex: 1;
      padding: 14px 8px;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    .tab-btn.active {
      color: var(--primary);
      background: var(--white);
      border-bottom: 3px solid var(--accent);
    }

    /* Konten Tab */
    .tab-content {
      padding: 24px;
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Area Kamera / Scanner */
    #reader {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 2px dashed var(--primary-light) !important;
      background: #fafafa;
    }
    #status-scanner {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      text-align: center;
      font-weight: 500;
      display: none;
    }
    .status-loading { background: #e0f2fe; color: #0369a1; }
    .status-success { background: var(--primary-light); color: var(--primary); }
    .status-error { background: #fee2e2; color: #b91c1c; }

    /* Form Login Multi-Role */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdfdc;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 81, 50, 0.1);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover {
      background: #0b3d26;
    }

    /* Tabel Riwayat Absen Ringkas */
    .history-section {
      margin-top: 20px;
    }
    .history-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #f8faf8;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
      border-left: 3px solid var(--accent);
    }
    .history-time {
      font-weight: 600;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- Header Sekolah -->
  <div class="header-app">
    <div class="logo-container">
      <img src="binailmu.png" alt="Logo Sekolah" onerror="this.src='https://via.placeholder.com/70/0f5132/ffffff?text=LOGO'">
    </div>
    <h1>E-Absensi & Portal Digital</h1>
    <p>Silakan scan QR Code Anda atau masuk ke portal akademis</p>
  </div>

  <!-- Wrapper Utama -->
  <div class="main-wrapper">
    <!-- Menu Pindah Tab -->
    <div class="tab-navigation">
      <button class="tab-btn active" onclick="switchTab('scan-tab')">📷 Scan QR</button>
      <button class="tab-btn" onclick="switchTab('face-tab')">👤 Face Login</button>
      <button class="tab-btn" onclick="switchTab('login-tab')">🔑 PIN Login</button>
    </div>

    <!-- TAB 1: AREA LANGSUNG SCAN -->
    <div id="scan-tab" class="tab-content active">
      <div id="reader"></div>
      <div id="status-scanner"></div>

      <!-- Riwayat Scan Singkat Sesi Ini -->
      <div class="history-section">
        <div class="history-title">Aktivitas Scan Terbaru</div>
        <div id="history-list">
          <p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 10px;">Belum ada antrean absensi.</p>
        </div>
      </div>
    </div>

    <!-- TAB 2: LOGIN BERBASIS FACE RECOGNITION -->
    <div id="face-tab" class="tab-content">
      <div style="text-align: center; margin-bottom: 12px;">
        <h3 style="font-size: 16px; color: var(--primary);">Login Pengenalan Wajah</h3>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Posisikan wajah Anda tegak menghadap ke arah kamera.</p>
      </div>

      <div style="position: relative; width: 100%; max-width: 340px; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #000; border: 2px solid var(--accent);">
        <video id="faceVideo" autoplay playsinline muted style="width: 100%; height: 260px; object-fit: cover; display: block;"></video>
        <canvas id="faceOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
      </div>

      <div id="status-face" style="margin-top: 14px; padding: 12px; border-radius: 12px; font-size: 13px; text-align: center; font-weight: 600;" class="status-loading">
        Mengaktifkan kamera & model Face ID...
      </div>

      <div style="text-align: center; margin-top: 12px;">
        <button type="button" onclick="startFaceRecognition()" class="btn-action" style="background: var(--primary); color: white; padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px;">
          🔄 Pindai Ulang Wajah
        </button>
      </div>
    </div>

    <!-- TAB 3: PORTAL LOGIN MULTI-ROLE -->
    <div id="login-tab" class="tab-content">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="role">Hak Akses / Jabatan</label>
          <select id="role" required>
            <option value="Kepala Sekolah">Kepala Sekolah</option>
            <option value="Guru">Guru / Staf</option>
            <option value="Orang Tua">Orang Tua Murid</option>
            <option value="Mudir">Mudir (Pimpinan Utama)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="username">Email Pengguna</label>
          <input type="text" id="username" placeholder="Masukkan email atau ID Anda" required>
        </div>
        <div class="form-group">
          <label for="password">Nomor PIN yang sudah diberikan</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Masuk ke Dashboard</button>
      </form>
      <div id="status-login" style="margin-top:12px; text-align:center; font-size:13px;"></div>
    </div>
  </div>

<script>
  // URL WEB APP GOOGLE APPS SCRIPT
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwfuIjsavW4QwHFhKxJaI1HjHZGx-16Y95K0EpCEzsljG7MnHnPrkTDMSOUYKT2tVfW0Q/exec";
  
  let html5QrcodeScanner;
  let canScan = true;

  // State Face Recognition
  let faceApiLoaded = false;
  let faceProfiles = [];
  let faceVideoStream = null;
  let faceDetectInterval = null;
  let isFaceLoginSuccess = false;

  // Fungsi Pindah Tab Antarmuka
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    if (event && event.currentTarget) {
      event.currentTarget.classList.add('active');
    }

    // Kelola kamera masing-masing tab
    if (tabId === 'scan-tab') {
      stopFaceCamera();
      startCamera();
    } else if (tabId === 'face-tab') {
      if (html5QrcodeScanner) { try { html5QrcodeScanner.stop(); } catch(e){} }
      startFaceRecognition();
    } else {
      if (html5QrcodeScanner) { try { html5QrcodeScanner.stop(); } catch(e){} }
      stopFaceCamera();
    }
  }

  // Fungsi Menjalankan Kamera Scanner
  function startCamera() {
    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      { fps: 12, qrbox: { width: 260, height: 260 } },
      onScanSuccess
    ).catch(err => {
      document.getElementById("reader").innerHTML = `<p style="color:var(--danger); text-align:center; padding:20px; font-size:13px;">Gagal mengakses kamera. Mohon setujui izin kamera pada browser HTTPS Anda.</p>`;
    });
  }

  // Fungsi Ketika QR Code Berhasil Terbaca Kamera
  function onScanSuccess(decodedText) {
    if (!canScan) return;
    canScan = false; 

    setScanStatus("Mencocokkan data ID...", "status-loading");

    fetch(BACKEND_URL, {
      method: "POST",
      body: JSON.stringify({ action: "scanAbsen", barcodeId: decodedText })
    })
    .then(response => response.json())
    .then(res => {
      if(res.ok) {
        setScanStatus("✅ " + res.msg, "status-success");
        pushToHistory(decodedText);
      } else {
        setScanStatus("❌ " + res.msg, "status-error");
      }
      setTimeout(() => { 
        canScan = true; 
        setScanStatus("", ""); 
      }, 3000);
    })
    .catch(err => {
      setScanStatus("❌ Koneksi Gagal atau Respons Invalid", "status-error");
      setTimeout(() => { canScan = true; }, 3000);
    });
  }

  function setScanStatus(msg, className) {
    const el = document.getElementById("status-scanner");
    if(!msg) { el.style.display = "none"; return; }
    el.className = "";
    el.classList.add(className);
    el.innerText = msg;
    el.style.display = "block";
  }

  function pushToHistory(idText) {
    const list = document.getElementById("history-list");
    if(list.innerHTML.includes("Belum ada antrean")) list.innerHTML = "";

    const t = new Date();
    const waktu = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0') + ':' + String(t.getSeconds()).padStart(2,'0');

    const item = document.createElement("div");
    item.className = "history-item";
    item.innerHTML = `<span>ID: <strong>${idText}</strong></span> <span class="history-time">${waktu} WIB</span>`;
    list.prepend(item);
  }

  // ==========================================
  // LOGIKA PORTAL LOGIN DAN PENGALIHAN DASHBOARD
  // ==========================================
  function handleLogin(e) {
    e.preventDefault();
    const role = document.getElementById("role").value;
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;
    const statusEl = document.getElementById("status-login");

    statusEl.style.color = "var(--primary)";
    statusEl.innerText = "Memverifikasi akun...";

    fetch(BACKEND_URL, {
      method: "POST",
      body: JSON.stringify({ action: "loginPortal", role: role, username: user, password: pass })
    })
    .then(response => response.json())
    .then(res => {
      if (res.ok) {
        statusEl.style.color = "var(--success)";
        statusEl.innerText = `Login Berhasil! Mengalihkan halaman...`;

        // Menyimpan token dan data identitas ke LocalStorage browser
        localStorage.setItem('auth_token', res.auth_token); 
        localStorage.setItem('user_nama', res.nama);
        localStorage.setItem('user_role', res.role); 
        localStorage.setItem('id_terkait', res.idTerkait);

        // Pengalihan halaman yang sinkron dengan penamaan return role Apps Script
        setTimeout(() => {
          redirectByRole(res.role);
        }, 1000);

      } else {
        statusEl.style.color = "var(--danger)";
        statusEl.innerText = "Gagal login: " + res.msg;
      }
    })
    .catch(err => {
      statusEl.style.color = "var(--danger)";
      statusEl.innerText = "Terjadi kendala jaringan saat otentikasi.";
      console.error(err);
    });
  }

  function redirectByRole(role) {
    if (role === 'Mudir' || role === 'Pimpinan') {
      window.location.href = 'dashboard-mudir.html';
    } else if (role === 'KepalaSekolah' || role === 'Kepala Sekolah') {
      window.location.href = 'dashboard-kepsek.html';
    } else if (role === 'Guru') {
      window.location.href = 'dashboard-guru.html';
    } else if (role === 'OrangTua' || role === 'Orang Tua') {
      window.location.href = 'dashboard-orangtua.html';
    } else {
      window.location.href = 'dashboard-guru.html';
    }
  }

  // ==========================================
  // FITUR LOGIN BERBASIS FACE RECOGNITION
  // ==========================================
  async function initFaceAPI() {
    try {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      faceApiLoaded = true;
      console.log("Model Face-API siap.");
    } catch(err) {
      console.warn("Gagal inisialisasi Face-API:", err);
    }
  }

  async function loadFaceProfiles() {
    try {
      const response = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "getFaceProfiles" })
      });
      const res = await response.json();
      if (res.ok && Array.isArray(res.data)) {
        faceProfiles = res.data;
        console.log(`Berhasil memuat ${faceProfiles.length} profil wajah.`);
      }
    } catch(err) {
      console.warn("Gagal memuat profil wajah:", err);
    }
  }

  async function startFaceRecognition() {
    isFaceLoginSuccess = false;
    const statusEl = document.getElementById("status-face");
    statusEl.className = "status-loading";
    statusEl.style.display = "block";
    statusEl.innerText = "Mempersiapkan pendeteksian wajah...";

    if (!faceApiLoaded) {
      await initFaceAPI();
    }
    if (faceProfiles.length === 0) {
      await loadFaceProfiles();
    }

    const video = document.getElementById("faceVideo");
    try {
      if (faceVideoStream) {
        stopFaceCamera();
      }
      faceVideoStream = await navigator.mediaDevices.getUserMedia({ video: { width: 340, height: 260 } });
      video.srcObject = faceVideoStream;

      video.onloadedmetadata = () => {
        statusEl.innerText = "Silakan hadap kamera untuk verifikasi wajah...";
        jalankanPendeteksianWajah();
      };
    } catch(err) {
      statusEl.className = "status-error";
      statusEl.innerText = "Gagal mengakses kamera: " + err.message;
    }
  }

  function jalankanPendeteksianWajah() {
    const video = document.getElementById("faceVideo");
    const statusEl = document.getElementById("status-face");

    if (faceDetectInterval) clearInterval(faceDetectInterval);

    // Ambil matcher jika ada profile yang valid
    const labeledDescriptors = [];
    faceProfiles.forEach(p => {
      if (p.faceDescriptor && Array.isArray(p.faceDescriptor) && p.faceDescriptor.length === 128) {
        labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(
          JSON.stringify({ id: p.id, nama: p.nama, role: p.role }),
          [new Float32Array(p.faceDescriptor)]
        ));
      }
    });

    let faceMatcher = null;
    if (labeledDescriptors.length > 0) {
      faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);
    }

    faceDetectInterval = setInterval(async () => {
      if (isFaceLoginSuccess || !video.srcObject) return;

      try {
        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks()
          .withFaceDescriptor();

        if (detection) {
          if (!faceMatcher) {
            statusEl.className = "status-error";
            statusEl.innerText = "Wajah terdeteksi, namun belum ada profil wajah terdaftar di sistem. Hubungi Mudir.";
            return;
          }

          const match = faceMatcher.findBestMatch(detection.descriptor);
          if (match.label !== 'unknown') {
            const userData = JSON.parse(match.label);
            isFaceLoginSuccess = true;
            clearInterval(faceDetectInterval);
            stopFaceCamera();

            statusEl.className = "status-success";
            statusEl.innerHTML = `✅ Wajah Dikenali: <strong>${userData.nama}</strong> (${userData.role})<br>Mengalihkan ke dashboard...`;

            // Simpan sesi login
            localStorage.setItem('auth_token', 'FACE_' + Date.now());
            localStorage.setItem('user_nama', userData.nama);
            localStorage.setItem('user_role', userData.role);
            localStorage.setItem('id_terkait', userData.id);

            setTimeout(() => {
              redirectByRole(userData.role);
            }, 1200);
          } else {
            statusEl.className = "status-loading";
            statusEl.innerText = "Wajah tidak cocok dengan pengguna terdaftar. Menyesuaikan posisi...";
          }
        } else {
          statusEl.className = "status-loading";
          statusEl.innerText = "Mencari wajah... Harap posisikan wajah ke tengah kamera.";
        }
      } catch(e) {
        console.warn("Deteksi error:", e);
      }
    }, 500);
  }

  function stopFaceCamera() {
    if (faceDetectInterval) {
      clearInterval(faceDetectInterval);
      faceDetectInterval = null;
    }
    if (faceVideoStream) {
      faceVideoStream.getTracks().forEach(t => t.stop());
      faceVideoStream = null;
    }
    const video = document.getElementById("faceVideo");
    if (video) video.srcObject = null;
  }

  window.onload = function() {
    startCamera();
    initFaceAPI();
    loadFaceProfiles();
  };
</script>
</body>
</html>
